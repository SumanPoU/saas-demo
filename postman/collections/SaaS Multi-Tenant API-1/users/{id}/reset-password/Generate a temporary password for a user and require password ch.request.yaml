$kind: http-request
name: Generate a temporary password for a user and require password change on next login
description: Admin reset flow. Generates a new temporary password, emails it to the selected user, sets mustChangePassword to true, and revokes active sessions and refresh tokens.
url: "{{baseUrl}}/users/:id/reset-password"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: "(Required) "
body:
  type: text
  content: ""
examples: ./.resources/Generate a temporary password for a user and require password ch.resources/examples
order: 1000
