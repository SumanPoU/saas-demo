$kind: http-example
name: User created successfully. Temporary password is sent by email and is not returned in the response.
request:
  url: "{{baseUrl}}/users"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "username": "<string>",
        "firstName": "<string>",
        "lastName": "<string>",
        "roleIds": [
          "<string>",
          "<string>"
        ],
        "isActive": "<boolean>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
