$kind: http-request
description: The request body does not accept a password. The API generates a temporary password, emails it to the user, marks mustChangePassword as true, and returns only safe user fields.
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "<string>",
      "username": "<string>",
      "firstName": "<string>",
      "lastName": "<string>",
      "roleIds": [
        "<string>",
        "<string>"
      ],
      "isActive": "<boolean>"
    }
examples: ./.resources/Create a user with a generated temporary password sent by email.resources/examples
order: 1000
