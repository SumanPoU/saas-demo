$kind: http-example
request:
  url: "{{baseUrl}}/auth/set-required-password"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "passwordChangeToken": "<string>",
        "newPassword": "<string>",
        "confirmPassword": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
