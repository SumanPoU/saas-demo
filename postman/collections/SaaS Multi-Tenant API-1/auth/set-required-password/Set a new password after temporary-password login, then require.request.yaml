$kind: http-request
name: Set a new password after temporary-password login, then require normal login
description: Consumes the short-lived passwordChangeToken returned by login when requiresPasswordChange is true. This endpoint sets the real password, clears mustChangePassword, revokes existing sessions/tokens, and does not issue auth tokens. The user must log in again with the new password.
url: "{{baseUrl}}/auth/set-required-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "passwordChangeToken": "<string>",
      "newPassword": "<string>",
      "confirmPassword": "<string>"
    }
examples: ./.resources/Set a new password after temporary-password login, then require.resources/examples
order: 1000
