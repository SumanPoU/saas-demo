$kind: http-request
name: "Step 3: Complete password recovery by setting a new password using recovery identifier and OTP code"
url: "{{baseUrl}}/auth/reset-password/complete"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "identifier": "<string>",
      "code": "<string>",
      "password": "<string>",
      "confirmPassword": "<string>"
    }
examples: ./.resources/Step 3- Complete password recovery by setting a new password usi.resources/examples
order: 1000
