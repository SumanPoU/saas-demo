$kind: http-request
description: Returns access and refresh tokens for normal users. If the password is system-generated and must be changed, no auth tokens are issued; the response includes passwordChangeToken and nextStep details for POST /auth/set-required-password.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "identifier": "<string>",
      "password": "<string>"
    }
examples: ./.resources/Log in with username or email and password.resources/examples
order: 1000
