$kind: http-example
request:
  url: "{{baseUrl}}/auth/register/verify-otp"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "otp": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 2000
