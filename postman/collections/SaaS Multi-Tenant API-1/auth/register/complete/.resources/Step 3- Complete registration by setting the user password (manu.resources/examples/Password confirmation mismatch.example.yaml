request:
  url: "{{baseUrl}}/auth/register/complete"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "code": "<string>",
        "password": "<string>",
        "confirmPassword": "<string>",
        "tenantName": "<string>"
      }
