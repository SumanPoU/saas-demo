$kind: http-request
description: Updates the JSON value for the selected key. Runtime config changes are read dynamically by services through RuntimeConfigService; throttler settings may require an application restart depending on NestJS throttler initialization.
url: "{{baseUrl}}/global-config/:key"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: key
    value: jwt
    description: (Required)  (This can only be one of bcrypt,throttle,jwt,app,mail)
body:
  type: json
  content: ""
examples: ./.resources/Update a global configuration by key.resources/examples
order: 2000
