$kind: http-example
request:
  url: "{{baseUrl}}/tenants/:tenantId/members/invite"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: tenantId
      value: <string>
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "roleId": "<string>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
