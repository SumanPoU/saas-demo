$kind: http-example
request:
  url: "{{baseUrl}}/roles"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "description": "<string>",
        "isDefault": "<boolean>"
      }
