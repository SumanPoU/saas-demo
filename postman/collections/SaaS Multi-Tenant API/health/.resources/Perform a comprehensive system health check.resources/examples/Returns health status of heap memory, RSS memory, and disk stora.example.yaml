  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "<string>",
        "info": {
          "key_0": {
            "status": "<string>"
          },
          "key_1": {
            "status": "<string>"
          },
          "key_2": {
            "status": "<string>"
          }
        },
        "error": {
          "key_0": {
            "status": "<string>"
          },
          "key_1": {
            "status": "<string>"
          }
        },
        "details": {
          "key_0": {
            "status": "<string>"
          },
          "key_1": {
            "status": "<string>"
          }
        }
      }
order: 1000
