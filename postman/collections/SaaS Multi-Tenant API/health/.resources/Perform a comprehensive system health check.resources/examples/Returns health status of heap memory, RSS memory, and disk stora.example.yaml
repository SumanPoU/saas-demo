$kind: http-example
name: |-
  Returns health status of heap memory, RSS memory, and disk storage.

  The Health Check is successful
request:
  url: "{{baseUrl}}/health"
  method: GET
  headers:
    Accept: application/json
  body:
    type: text
    content: ""
