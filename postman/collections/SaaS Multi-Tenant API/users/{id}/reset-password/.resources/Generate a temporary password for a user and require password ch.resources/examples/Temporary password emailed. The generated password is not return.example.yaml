$kind: http-example
name: Temporary password emailed. The generated password is not returned in the response.
request:
  url: "{{baseUrl}}/users/:id/reset-password"
  method: POST
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: <string>
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
