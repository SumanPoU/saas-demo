request:
  url: "{{baseUrl}}/users"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "username": "<string>",
        "firstName": "<string>",
        "lastName": "<string>",
        "roleIds": [
          "<string>",
          "<string>"
        ],
        "isActive": "<boolean>"
      }
