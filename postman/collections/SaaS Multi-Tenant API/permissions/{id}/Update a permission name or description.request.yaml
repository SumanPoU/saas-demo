$kind: http-request
url: "{{baseUrl}}/permissions/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <string>
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "description": "<string>"
    }
examples: ./.resources/Update a permission name or description.resources/examples
order: 2000
