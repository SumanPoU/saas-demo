$kind: http-example
request:
  url: "{{baseUrl}}/auth/change-password"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "currentPassword": "<string>",
        "newPassword": "<string>",
        "confirmPassword": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
