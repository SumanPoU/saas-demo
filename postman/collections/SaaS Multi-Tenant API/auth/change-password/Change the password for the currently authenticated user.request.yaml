$kind: http-request
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "<string>",
      "newPassword": "<string>",
      "confirmPassword": "<string>"
    }
examples: ./.resources/Change the password for the currently authenticated user.resources/examples
order: 1000
