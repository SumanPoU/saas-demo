$kind: http-example
name: Successful login. Either tokens are returned, or passwordChangeToken is returned when requiresPasswordChange is true.
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "identifier": "<string>",
        "password": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
