$kind: http-request
description: Admin generates a new temporary password for userId. The password is emailed to that user, mustChangePassword is set to true, and active sessions/tokens are revoked. Paste the emailed value into temporaryPassword before testing login.
url: "{{baseUrl}}/v1/users/{{userId}}/reset-password"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 5000
