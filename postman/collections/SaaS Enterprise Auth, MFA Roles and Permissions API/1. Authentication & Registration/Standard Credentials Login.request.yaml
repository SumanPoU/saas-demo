$kind: http-request
description: Standard login with credentials. Normal users receive access/refresh tokens. Users with a system-generated temporary password receive passwordChangeToken and must run Set Required Password before logging in again.
url: "{{baseUrl}}/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identifier": "{{loginIdentifier}}",
      "password": "{{loginPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      const data = response.data || response;
      if (pm.response.code === 200 && data) {
          if (data.tokens) {
              pm.environment.set("accessToken", data.tokens.accessToken);
              pm.environment.set("refreshToken", data.tokens.refreshToken);
              pm.environment.set("passwordChangeToken", "");
              pm.environment.set("mfaPendingToken", "");
              console.log("Access & Refresh tokens captured successfully!");
          } else if (data.accessToken) {
              pm.environment.set("accessToken", data.accessToken);
              pm.environment.set("refreshToken", data.refreshToken);
              pm.environment.set("passwordChangeToken", "");
              pm.environment.set("mfaPendingToken", "");
              console.log("Access & Refresh tokens captured successfully!");
          } else if (data.requiresPasswordChange && data.passwordChangeToken) {
              pm.environment.set("passwordChangeToken", data.passwordChangeToken);
              pm.environment.set("accessToken", "");
              pm.environment.set("refreshToken", "");
              console.log("Captured passwordChangeToken. Run Set Required Password, then login again with requiredNewPassword.");
          } else if (data.requiresMfa && data.mfaPendingToken) {
              pm.environment.set("mfaPendingToken", data.mfaPendingToken);
              console.log("Captured short-lived mfaPendingToken. Proceed to complete login at mid-login verification endpoint!");
          }
      }
    language: text/javascript
order: 5000
