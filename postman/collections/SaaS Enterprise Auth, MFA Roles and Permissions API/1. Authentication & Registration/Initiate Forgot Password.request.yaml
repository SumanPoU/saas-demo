$kind: http-request
description: "Password recovery Step 1: Searches user and dispatches password recovery OTP code email (preventing user enumeration leaks)."
url: "{{baseUrl}}/v1/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identifier": "test-mfa-user@example.com"
    }
order: 11000
