$kind: http-request
description: "Password recovery Step 3: Hashes new password and terminates all active sessions across all devices."
url: "{{baseUrl}}/v1/auth/reset-password/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identifier": "test-mfa-user@example.com",
      "code": "{{passwordResetOtp}}",
      "password": "{{newPassword}}",
      "confirmPassword": "{{newPassword}}"
    }
order: 13000
