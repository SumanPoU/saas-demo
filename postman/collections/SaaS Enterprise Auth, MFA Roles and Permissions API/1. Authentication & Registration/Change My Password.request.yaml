$kind: http-request
description: Allows changing password from inside active authenticated session. Triggers database force revocation on all other sessions.
url: "{{baseUrl}}/v1/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "Password123!",
      "newPassword": "NewPassword123!",
      "confirmPassword": "NewPassword123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 10000
