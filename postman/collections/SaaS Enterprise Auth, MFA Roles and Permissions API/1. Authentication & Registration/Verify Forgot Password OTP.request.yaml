$kind: http-request
description: "Password recovery Step 2: Validates reset OTP code, returning success without tokens."
url: "{{baseUrl}}/v1/auth/reset-password/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identifier": "test-mfa-user@example.com",
      "otp": "{{passwordResetOtp}}"
    }
order: 12000
