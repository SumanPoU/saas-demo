$kind: http-request
description: Second step for users who logged in with a system-generated temporary password. Uses passwordChangeToken from login, sets a permanent password, clears mustChangePassword, and requires the user to run Standard Credentials Login again with requiredNewPassword.
url: "{{baseUrl}}/v1/auth/set-required-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "passwordChangeToken": "{{passwordChangeToken}}",
      "newPassword": "{{requiredNewPassword}}",
      "confirmPassword": "{{requiredNewPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      const data = response.data || response;
      if (pm.response.code === 200 && data && data.success !== false) {
          pm.environment.set("loginPassword", pm.environment.get("requiredNewPassword") || "");
          pm.environment.set("passwordChangeToken", "");
          console.log("Required password set. loginPassword was updated to requiredNewPassword; run Standard Credentials Login again.");
      }
order: 7000
